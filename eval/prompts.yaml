# Fixed eval set. 50 prompts, hand-written, committed, never changed casually --
# the whole point is that run N+1 is comparable to run N.
#
# NEEDS REVIEW by the user (Malaysian). Register mistakes in these prompts are the
# kind of thing an agent cannot self-check; if a prompt reads wrong, fix it BEFORE
# the first real training run, not after, because changing the set invalidates
# every earlier comparison.
#
# variety: which dialect the response should be in
# scenario: coarse register bucket, for per-scenario breakdown in the report

prompts:
  # ---------------- sg / casual chat ----------------
  - {id: sg01, variety: sg, scenario: chat, text: "eh you free this weekend or not"}
