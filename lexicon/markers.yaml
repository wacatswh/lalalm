# Dialect marker lexicon. Shared by eval (010) and corpus scoring (008).
#
# Used to RANK and WEIGHT, never to gate. Language-ID classifiers label Singlish
# as either "English" or low-confidence garbage, so any language filter deletes
# precisely the best text in the corpus. Marker density is the substitute.
#
# This is a seed. Ticket 008 extends it by reading real scraped data -- the list
# below is what I could write down a priori, not the finished lexicon.

