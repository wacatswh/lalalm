# Corpus sources. Every scraper reads this file; nothing hardcodes a source list.
#
# variety:  sg | my          -- which dialect. Required. Drives per-variety balance.
# register: forum | spoken | social
# enabled:  false parks a source without deleting it (keeps the reasoning visible)
# verify:   true means the identifier has NOT been confirmed to exist yet.
#           Scrapers skip verify:true entries unless --include-unverified is passed.
#
# Manglish is co-equal here, not an afterthought. r/malaysia is noticeably more
# formal-English than r/singapore, so `my` depth has to come from Lowyat and from
# Malaysian spoken sources -- not from treating the two subreddits as equivalent.

sources:
  # ---------------- Singlish: Reddit ----------------
  - kind: reddit
    name: singapore
    variety: sg
    register: social
    enabled: true

  - kind: reddit
    name: SingaporeRaw
    variety: sg
    register: social
    enabled: true

  - kind: reddit
    name: askSingapore
    variety: sg
    register: social
    enabled: true

  # ---------------- Manglish: Reddit ----------------
  - kind: reddit
    name: malaysia
    variety: my
    register: social
    enabled: true

  - kind: reddit
    name: Bolehland
    variety: my
    register: social
    enabled: true

  - kind: reddit
    name: malaysians
    variety: my
    register: social
    enabled: true

  - kind: reddit
    name: MalaysianFood
    variety: my
    register: social
    enabled: true

  # ---------------- Manglish: forum ----------------
  # Discovery via sitemap_index.xml rather than hardcoded board ids, so we never
  # guess an id. robots.txt (checked 2026-11-25) disallows /index.php and
  # /lofiversion for User-agent:*, so ONLY /topic/<id> URLs are permitted.
  - kind: lowyat
    name: forum.lowyat.net
    discover: sitemap
    variety: my
    register: forum
    enabled: true

  # ---------------- Spoken register ----------------
  # Verified 2026-11-25 with yt-dlp: these handles resolve to real channels with
  # real videos. Handles that did NOT resolve were removed rather than left as
  # aspirational config: @NightOwlCinematics, @JinnyboyTV, @DissyOfficial.
  #
  # Spoken sources fix vocabulary and register (stage 1) and are the only place
  # code-switching appears. They do NOT give conversational pairs: captions have no
  # reply tree, so ingest.py links each cue to the previous one by adjacency, and
  # a podcast is mostly monologue or interview. Stage 2 pairs still need reply
  # edges, i.e. forums and Reddit.

  # Long-form Singaporean podcast. Currently the ONLY sg source that needs no
  # credentials, so it carries the whole sg side until Reddit is unblocked.
  - kind: youtube
    name: "@yahlahbut"
    variety: sg
    register: spoken
    max_videos: 60
    enabled: false      # see ticket 016: auto-captions yield 0% marker density
    verify: false

  # Malaysian political podcast, heavily Malay -- good for code-switching.
  - kind: youtube
    name: "@KeluarSekejap"
    variety: my
    register: spoken
    max_videos: 60
    enabled: false      # see ticket 016
    verify: false

  # Real Malaysian channel, but its output is music videos. Parked: a handful of
  # songs is a rounding error in volume, and lyric register (rhythmic, repetitive,
  # non-conversational) is the opposite of what a chat model needs. Lyrics are also
  # copyrighted, so this project does not build a lyrics corpus.
  - kind: youtube
    name: "@otakotakVCD"
    variety: my
    register: spoken
    enabled: false
    verify: false

  # NEEDS-HUMAN: the Malaysian creator troupe Dissy (~759k subs, "Don Play Play",
  # "Kennot Lah You") is a strong fit for SKETCH/dialogue content -- not their songs.
  # The handle @dissy resolves to an unrelated channel ("Luchia Kaito Story"), so the
  # real channel URL is needed. Their comedy sketches are spoken dialogue and would
  # be high-value; their music videos would not.
  - kind: youtube
    name: "https://www.youtube.com/@REPLACE-WITH-REAL-DISSY-URL/videos"
    variety: my
    register: spoken
    enabled: false
    verify: true
